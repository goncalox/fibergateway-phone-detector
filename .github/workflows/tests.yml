name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-and-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Demo without Home Assistant or third-party dependencies
        run: python tools/standalone.py --demo --json
      - name: Install standalone dependencies
        run: python -m pip install -r requirements-standalone.txt
      - name: Check Python syntax
        run: python -m compileall -q custom_components tools tests
      - name: Run parser, router, classifier and standalone tests
        run: python -m unittest discover -s tests -v
      - name: Install Home Assistant for runtime smoke test
        run: python -m pip install homeassistant==2025.3.0
      - name: Verify config flow, options and entity states in Home Assistant
        run: python tools/ha_smoke_test.py
