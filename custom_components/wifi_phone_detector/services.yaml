execute_command:
  fields:
    config_entry_id: &router
      selector:
        config_entry:
          integration: wifi_phone_detector
    command:
      required: true
      example: "/device-info/show"
      selector:
        text:
create_time_restriction:
  fields:
    config_entry_id: *router
    name:
      required: true
      example: "Weekday-Night"
      selector:
        text:
    mac:
      required: true
      example: "02:11:22:33:44:55"
      selector:
        text:
    days:
      required: true
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: Mon
            - label: Tuesday
              value: Tue
            - label: Wednesday
              value: Wed
            - label: Thursday
              value: Thu
            - label: Friday
              value: Fri
            - label: Saturday
              value: Sat
            - label: Sunday
              value: Sun
    start_time:
      required: true
      default: "00:00:00"
      selector:
        time:
    end_time:
      required: true
      default: "05:00:00"
      selector:
        time:
remove_time_restriction:
  fields:
    config_entry_id: *router
    name:
      required: true
      selector:
        text:
get_time_restrictions:
  fields:
    config_entry_id: *router
get_router_info:
  fields:
    config_entry_id: *router
refresh_devices:
  fields:
    config_entry_id: *router
